apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  description: "Tugas untuk membersihkan resource lama sebelum pipeline baru dimulai"
  steps:
    - name: cleanup
      image: alpine:latest
      script: |
        echo "Sedang membersihkan workspace dan sisa-sisa build sebelumnya..."
        rm -rf /workspace/source/*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test-task
spec:
  description: "Tugas untuk menjalankan unit test menggunakan nose di cluster"
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install nose flake8
        echo "Menjalankan Linting..."
        flake8 .
        echo "Menjalankan Unit Tests..."
        nosetests